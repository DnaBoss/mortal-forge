services:
  mortal-mcp:
    image: mortal-mcp:local
    build:
      context: ..
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /home/cash
      MORTAL_BIND_HOST: 127.0.0.1
      MORTAL_FLUKE_ROOT: ${MORTAL_FLUKE_ROOT:?set MORTAL_FLUKE_ROOT}
      MORTAL_TOOL_CATALOG: /home/cash/tools/tools.json
    volumes:
      - ${MORTAL_FLUKE_ROOT}:${MORTAL_FLUKE_ROOT}
      - /home/cash/tools:/home/cash/tools:ro
      - /home/cash/.local/state/mortal-mcp:/home/cash/.local/state/mortal-mcp
      - /tmp:/tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 18765), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
