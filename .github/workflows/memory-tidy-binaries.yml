name: memory-tidy-binaries

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/memory-tidy/scripts/**"
      - "plugins/memory-tidy/tests/**"
      - ".github/workflows/memory-tidy-binaries.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m PyInstaller --onefile --name memory-tidy --paths plugins/memory-tidy/scripts plugins/memory-tidy/scripts/memory_tidy_cli.py
      - name: Smoke test
        shell: bash
        run: |
          ./dist/memory-tidy tidy --mcp-idle-hours 999
          ./dist/memory-tidy idle
          ./dist/memory-tidy install
      - name: End-to-end idle close test
        shell: bash
        run: python plugins/memory-tidy/tests/e2e_idle.py dist/memory-tidy
      - name: Orphan agent test
        shell: bash
        run: python plugins/memory-tidy/tests/e2e_orphan.py dist/memory-tidy
      - name: Hook merge test
        shell: bash
        run: python -I plugins/memory-tidy/tests/hook_merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: memory-tidy-${{ matrix.name }}
          path: dist/memory-tidy*
